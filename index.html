<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef0f2">
  <script>
    // 着せ替え：表示の前に色を決めて、ちらつきを防ぐ（詳しくは js/app.js の applyTheme）
    (function () {
      var id = "chomen", follow = true;
      try { id = localStorage.getItem("kakeibo.theme") || id; follow = localStorage.getItem("kakeibo.themeFollowDark") !== "0"; } catch (e) {}
      if (follow && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) id = "yoru";
      document.documentElement.dataset.theme = id;
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="家計簿">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>レシート家計簿</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app"><div class="page center"><div class="spinner"></div></div></div>
  <div id="toast"></div>
</body>
</html>
